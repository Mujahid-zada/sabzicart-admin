name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/mykey.pem
          chmod 600 ~/.ssh/mykey.pem
          
          # Tell SSH to always use this key
          echo "Host *" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/mykey.pem" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          
          # Trust the EC2 server's host key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Run deploy script
        run: |
          chmod +x scripts/deploy-laravel.sh
          ./scripts/deploy-laravel.sh ubuntu@${{ secrets.EC2_HOST }}
