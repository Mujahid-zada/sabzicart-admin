name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          # Write the private key from GitHub Secrets to a file
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/mykey.pem
          chmod 600 ~/.ssh/mykey.pem
          # Trust the EC2 server's host key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Run deploy script
        run: |
          chmod +x scripts/deploy-laravel.sh
          # Run the script, passing the user and host from secrets
          ./scripts/deploy-laravel.sh ubuntu@${{ secrets.EC2_HOST }}
